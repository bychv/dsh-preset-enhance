<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预设</title>
  <link rel="stylesheet" href="/preset-enhance/preset-picker.css">
</head>
<body>
  <header><strong>预设</strong><a id="workbench" target="_blank" rel="noopener">打开工作台</a></header>
  <p id="current"></p>
  <input id="search" type="search" placeholder="搜索预设" aria-label="搜索预设">
  <select id="presets" size="5" aria-label="预设列表"></select>
  <div class="actions">
    <button id="apply" disabled>使用此预设</button>
    <button id="inherit" disabled>跟随默认</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="preview" aria-label="提示词预览"></section>
  <script type="module" src="/preset-enhance/preset-picker.js"></script>
</body>
</html>
